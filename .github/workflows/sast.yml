name: SAST Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  bearer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Bearer SAST
        uses: bearer/bearer-action@v2
        with:
          path: .
          exit-code: 1
          severity: critical,high,medium
          # Exclude dev-only scripts from scan
          scanner: secrets,sast
          exclude-fingerprint: ''
